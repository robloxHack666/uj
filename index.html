<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Battle Royale Anime 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .hud-element {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
        #message {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
        }
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            cursor: pointer;
        }
        #instructions h1 { color: #ff5555; font-size: 48px; margin-bottom: 10px; }
        #instructions p { font-size: 18px; color: #ddd; max-width: 600px; text-align: center; line-height: 1.5; }
    </style>
    <!-- Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="instructions">
        <h1>BATTLE ROYALE ANIME 3D</h1>
        <p>Cliquez ici pour commencer.<br>
        <b>Z, Q, S, D</b> : Bouger | <b>Souris</b> : Viser | <b>Clic gauche</b> : Tirer<br>
        <b>E</b> : Ramasser l'arme au sol | <b>R</b> : Recharger<br>
        Survivez au cercle de feu et éliminez les cibles !</p>
    </div>

    <div id="hud">
        <div class="hud-element" id="hp-display">PV : 100</div>
        <div class="hud-element" id="weapon-display">Arme : Poings (0/0)</div>
        <div class="hud-element" id="zone-display">Zone de feu : Stable</div>
    </div>

    <div id="crosshair"></div>
    <div id="message"></div>
